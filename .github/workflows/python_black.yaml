name: black

on:
  push:
    branches:
      - "normalized-database"
  pull_request:
    branches:
      - "normalized-database"


permissions:
  contents: read
  # Lock down everything else explicitly
  checks: none
  actions: none
  deployments: none
  discussions: none
  id-token: none
  issues: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  black:
    name: "Black"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: psf/black@stable
        with:
          options: "--check --verbose"
          src: "./api-rework/invasives/api"
          version: "~= 25.0"
